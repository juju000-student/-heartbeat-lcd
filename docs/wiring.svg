<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="NanumGothic, Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, Arial, sans-serif">
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Arduino UNO + I2C LCD 1602 + 가변저항 연결도</text>

  <!-- Arduino UNO -->
  <rect x="40" y="70" width="240" height="320" rx="14" fill="#00878F" stroke="#005f64" stroke-width="3"/>
  <rect x="40" y="90" width="44" height="56" fill="#bbb" stroke="#777"/>
  <text x="62" y="123" text-anchor="middle" font-size="11" fill="#333">USB</text>
  <text x="140" y="280" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">ARDUINO</text>
  <text x="140" y="306" text-anchor="middle" font-size="16" fill="#e0f7f8">UNO</text>
  <g font-size="13" fill="#fff" font-weight="bold" text-anchor="end">
    <text x="262" y="134">GND</text>
    <text x="262" y="204">A0</text>
    <text x="262" y="254">5V</text>
    <text x="262" y="324">A4 (SDA)</text>
    <text x="262" y="364">A5 (SCL)</text>
  </g>

  <!-- Breadboard -->
  <rect x="340" y="70" width="240" height="220" rx="8" fill="#f4f1e8" stroke="#b4b2a9" stroke-width="2"/>
  <line x1="355" y1="105" x2="565" y2="105" stroke="#1e6fd9" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
  <line x1="355" y1="265" x2="565" y2="265" stroke="#d62828" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
  <text x="360" y="94" font-size="12" fill="#1e6fd9">− 레일 (GND, 0 V)</text>
  <text x="360" y="284" font-size="12" fill="#d62828">+ 레일 (5 V)</text>

  <!-- Potentiometer -->
  <g stroke="#555" stroke-width="3" stroke-linecap="round">
    <line x1="430" y1="205" x2="430" y2="225"/>
    <line x1="460" y1="205" x2="460" y2="225"/>
    <line x1="490" y1="205" x2="490" y2="225"/>
  </g>
  <rect x="420" y="170" width="80" height="38" rx="4" fill="#1e5fa8"/>
  <circle cx="460" cy="172" r="18" fill="#dcdcdc" stroke="#888" stroke-width="2"/>
  <line x1="460" y1="172" x2="460" y2="156" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <text x="460" y="146" text-anchor="middle" font-size="12" fill="#333">가변저항 (10 kΩ)</text>

  <!-- Wires -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 130 H310 V105 H355" stroke="#222"/>
    <path d="M280 250 H320 V265 H355" stroke="#d62828"/>
    <path d="M430 225 V232 H395 V105" stroke="#222"/>
    <path d="M490 225 V265" stroke="#d62828"/>
    <path d="M460 225 V240 H330 V200 H280" stroke="#1d9e75"/>
    <path d="M565 105 H600 V130 H640" stroke="#222"/>
    <path d="M565 265 H610 V180 H640" stroke="#d62828"/>
    <path d="M280 320 H640" stroke="#1e6fd9"/>
    <path d="M280 360 H640" stroke="#f2b705"/>
  </g>
  <g fill="#d4af37">
    <circle cx="280" cy="130" r="6"/><circle cx="280" cy="200" r="6"/><circle cx="280" cy="250" r="6"/>
    <circle cx="280" cy="320" r="6"/><circle cx="280" cy="360" r="6"/>
    <circle cx="640" cy="130" r="6"/><circle cx="640" cy="180" r="6"/><circle cx="640" cy="320" r="6"/><circle cx="640" cy="360" r="6"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="460" y="312">파랑 · SDA (데이터)</text>
    <text x="460" y="352">노랑 · SCL (클럭)</text>
  </g>

  <!-- I2C backpack + LCD -->
  <rect x="640" y="100" width="60" height="290" fill="#1b1b1b" rx="4"/>
  <g font-size="12" fill="#fff" font-weight="bold">
    <text x="652" y="134">GND</text>
    <text x="652" y="184">VCC</text>
    <text x="652" y="324">SDA</text>
    <text x="652" y="364">SCL</text>
  </g>
  <rect x="700" y="80" width="190" height="330" rx="8" fill="#2a8a3a" stroke="#1d5f28" stroke-width="3"/>
  <text x="795" y="110" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">LCD 16x02</text>
  <rect x="712" y="170" width="166" height="110" rx="4" fill="#1d1d1d"/>
  <rect x="720" y="178" width="150" height="94" fill="#2f63d6"/>
  <g fill="#e8f1ff">
    <rect x="728" y="196" width="3" height="3"/><rect x="731.5" y="196" width="3" height="3"/><rect x="738.5" y="196" width="3" height="3"/><rect x="742" y="196" width="3" height="3"/>
    <rect x="728" y="199.5" width="17" height="3"/><rect x="728" y="203" width="17" height="3"/><rect x="728" y="206.5" width="17" height="3"/><rect x="728" y="210" width="17" height="3"/>
    <rect x="731.5" y="213.5" width="10" height="3"/><rect x="735" y="217" width="3" height="3"/>
  </g>
  <text x="812" y="217" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#e8f1ff">72 BPM</text>
  <text x="795" y="310" text-anchor="middle" font-size="12" fill="#d8f3dc">(0,0) 칸 = 뛰는 하트</text>
  <text x="795" y="395" text-anchor="middle" font-size="10" fill="#d8f3dc">I2C 주소 0x27 (PCF8574)</text>

  <text x="460" y="445" text-anchor="middle" font-size="13" fill="#555">가변저항 세 핀은 서로 다른 세로줄에 · 양쪽 핀 = 5 V / 0 V, 가운데 핀 = A0 · A4, A5는 LCD 전용</text>
</svg>
